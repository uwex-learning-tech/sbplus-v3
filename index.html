<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Storybook+</title>

        <!-- warm up the connections used while loading the splash screen
             (author profile, splash image, program logo, analytics) so
             their DNS/TLS cost isn't paid serially mid-load -->
        <link rel="preconnect" href="https://media.uwex.edu" crossorigin>
        <link rel="dns-prefetch" href="https://media.uwex.edu">
        <link rel="preconnect" href="https://www.googletagmanager.com">
        <link rel="dns-prefetch" href="https://www.googletagmanager.com">

        <link id="sbplus_configs" href="sources/manifest.json" rel="manifest"/>
        <link href="sources/scripts/libs/videojs/video-js.min.css" rel="stylesheet" media="all" />
        <script src="sources/scripts/libs/modernizr.js" type="text/javascript"></script>
        <script src="sources/scripts/libs/jquery.js" type="text/javascript"></script>
        <script src="sources/scripts/libs/videojs/video.js" type="text/javascript"></script>
    </head>
    <body>
        
        <noscript>
    		<h1>JavaScript is required!</h1>
    		<p>In order for this application to function, please <a href="http://www.enable-javascript.com/" target="_blank">enable JavaScript</a>.</p>
    	</noscript>
        
        <div class="sbplus_wrapper" data-version="<%= version %>"></div>
        
    </body>
</html>
